# Nginx Virtual Host Configuration for insightstudio.peculiex.com
# Reverse proxy to Gunicorn WSGI running on 127.0.0.1:8001

server {
    listen 80;
    listen [::]:80;
    server_name insightstudio.peculiex.com;

    # Maximum file upload size (matches MAX_UPLOAD_MB in .env)
    client_max_body_size 100M;
    client_body_timeout 300s;

    access_log /var/log/nginx/insightstudio_access.log;
    error_log  /var/log/nginx/insightstudio_error.log;

    # Static file caching (optional direct serving for highest speed)
    location /static/ {
        alias /opt/insight-studio/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Application reverse proxy
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for large dataset analysis and PDF report generation
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }
}
