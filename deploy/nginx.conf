# Insight Studio - nginx reverse proxy template
#
# Native install (gunicorn on 127.0.0.1:8001):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/insight-studio
#   sudo ln -s /etc/nginx/sites-available/insight-studio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker install (container published on 127.0.0.1:8000):
#   change proxy_pass to http://127.0.0.1:8000;
#
# Then enable HTTPS:
#   sudo certbot --nginx -d example.com -d www.example.com
#
# Replace example.com, and /opt/insight-studio if the app lives elsewhere.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Match MAX_UPLOAD_MB in the app environment (100 MB by default).
    client_max_body_size 100m;
    client_body_timeout 300s;

    access_log /var/log/nginx/insight-studio.access.log;
    error_log  /var/log/nginx/insight-studio.error.log;

    # Optional: serve static assets directly in a native (non-Docker) install.
    # Uncomment only if the app is at /opt/insight-studio; for Docker the files
    # live inside the container, so leave this block commented out.
    #
    # location /static/ {
    #     alias /opt/insight-studio/static/;
    #     expires 7d;
    #     access_log off;
    #     try_files $uri =404;
    # }

    location / {
        proxy_pass http://127.0.0.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chart rendering and PDF export can take a little while on large files.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }
}
